input {
  beats {
    id => "filebeat_input"
    host => "0.0.0.0"
    port => 5044
    ecs_compatibility => "v8"
    enrich => "none"
  }
}

filter {
  # JSON 解码错误和转换错误属于无法靠重试修复的 poison event。
  # 先打标签并绕过批量 API，避免一条坏事件拖累同批合法事件。
  if [producer][error][type] == "json" {
    mutate {
      id => "mark_invalid_producer_json"
      add_tag => ["_invalid_producer_json"]
    }
  } else {
    ruby {
      id => "transform_ingestion_event"
      path => "/usr/share/logstash/pipeline/transform_event.rb"
      tag_on_exception => "_ingestion_transform_error"
    }
  }
}

output {
  if "_invalid_producer_json" in [tags] {
    stdout {
      id => "invalid_json_notice"

      codec => line {
        format => "rejected event reason=invalid_producer_json log_path=%{[log][file][path]} log_offset=%{[log][offset]}"
      }
    }
  } else if "_ingestion_transform_error" in [tags] {
    stdout {
      id => "transform_error_notice"

      codec => line {
        format => "rejected event reason=transform_error log_path=%{[log][file][path]} log_offset=%{[log][offset]}"
      }
    }
  } else {
    http {
      id => "ingestion_api_output"

      url => "${INGESTION_API_URL:http://api:8081/internal/v1/logs/bulk}"
      http_method => "post"
      format => "json_batch"
      content_type => "application/json"

      headers => {
        "Accept" => "application/json"
      }

      # API 以 event_id 幂等去重，因此 POST 可以安全重试；
      # 只对限流和 5xx 临时故障重试，永久 4xx 数据错误不会进入重试循环。
      automatic_retries => 1
      retry_non_idempotent => true

      retry_failed => true
      retryable_codes => [429, 500, 502, 503, 504]

      connect_timeout => 5
      socket_timeout => 10
      request_timeout => 15

      # 限制为单连接发送路径，避免无界并发放大 SQLite 的单写者压力。
      pool_max => 1
      pool_max_per_route => 1
    }
  }
}